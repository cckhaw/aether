name: Clean up Vercel deployments

# After every push to main, wait for its production deploy to finish, then delete all other
# deployments (old production builds and previews). Can also be run by hand.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only list what would be deleted
        type: boolean
        default: true

permissions: {}

concurrency:
  group: cleanup-vercel
  cancel-in-progress: false

env:
  VERCEL_PROJECT_ID: prj_za8oWdypGx6riiCaCSOwQbRfOlH9
  VERCEL_TEAM_ID: team_FdOJU6k0aSSHE2P7hHTWrNuP

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - name: Wait for this commit's production deploy
        if: github.event_name == 'push'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SHA: ${{ github.sha }}
        run: .github/scripts/wait-for-vercel.sh
      - name: Delete old deployments
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: .github/scripts/cleanup-vercel.sh
